spring.application.name=enterprise-asset-management
server.port=8080

# Active profile: 'dev' for standalone testing without MySQL, or 'mysql' / default for MySQL
spring.profiles.default=dev

# JWT Security Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# File Upload / Multipart Limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Disable automated SQL init scripts in favor of JPA Hibernate ddl-auto & DataInitializer
spring.sql.init.mode=never
